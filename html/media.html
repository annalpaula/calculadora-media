<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de média</title>
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>
    
    <div class="container">

    <h1>📚Calculadora de média</h1>
    <p class="subtitulo"> Sistema de notas do aluno</p>

    <div id="formulario">
        <label> Nome do aluno</label>
        <input type="text" id="nome"
        placeholder="digite o nome do aluno" required >
      
        <label> Nome da disciplina:</label>
        <select id="disciplina" required >
            <option value="=" > Selecione a disciplina </option>
            <option value="FDD">Fundamentos de design digital</option>
            <option value="FTDI">Fotografia digital</option>
            <option value="PRAAI">Projetos de audio e video I</option>
        </select>
      
        <div class="notas">

         <div>
       <label> 1ªBimestre</label>
       <input type="number" id="nota1"
       placeholder="digite a nota" required >
       </div>
       
       <div>
       <label> 2ªBimestre</label>
       <input type="number" id="nota2"
       placeholder="digite a nota" required >
       </div>

       <div>
       <label> 3ªBimestre</label>
       <input type="number" id="nota3"
       placeholder="digite a nota" required >
       </div>

       <div>
       <label> 4ªBimestre</label>
       <input type="number" id="nota4"
       placeholder="digite a nota" required >
       </div>

        </div>

        <button id="calcular" onclick="calcularMedia()">
             Calcular Média
        </button>

        <button id="novocalculo" onclick="calcularNovo()"> 
             Calcular novamente
        </button>

        <a href="https://annalpaula.github.io/calculadora-normal/" id="link">Calculadora normal</a>

       
    </div>
    
    <div id="resultado" class="resultado">
        <p>Preencha os dados acima e clique em calcular média</p>
    </div>

    </div>






    <script src= "../js/calcular-media.js"></script>
</body>
</html>
